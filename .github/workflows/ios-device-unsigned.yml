name: MATE iPhone Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iphone:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout MATE
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Restore llama.cpp XCFramework
        uses: actions/cache@v4
        with:
          path: Vendor/llama.xcframework
          key: mate-ios-llama-a2b3018-v2-${{ runner.arch }}

      - name: Prepare llama.cpp, KaTeX, and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          # Reuse the previously validated project setup. This also compiles the simulator app.
          bash scripts/build_ios.sh 2>&1 | tee build/logs/prepare.log

      - name: Build unsigned MATE for physical iPhone
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project MATE.xcodeproj \
            -scheme MATE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/logs/iphone-build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP='build/DerivedDataDevice/Build/Products/Release-iphoneos/MATE.app'
          test -d "$APP"
          # The dynamic llama.framework must be embedded in MATE.app.
          test -f "$APP/Frameworks/llama.framework/llama" || {
            echo '::error::llama.framework missing. Ensure project.yml has embed: true'
            exit 1
          }
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/MATE.app
          (cd build/ipa && zip -qr MATE-unsigned.ipa Payload)
          unzip -l build/ipa/MATE-unsigned.ipa | grep -E 'Payload/MATE.app/(MATE|Frameworks/llama.framework/llama)' || true
          echo 'Unsigned IPA ready for a free Apple-ID sideloading tool.'

      - name: Upload unsigned iPhone IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MATE-iPhone-unsigned-IPA
          path: |
            build/ipa/MATE-unsigned.ipa
            build/logs/
          if-no-files-found: warn
          retention-days: 7
